[package]
name = "kokjinsam-just"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[lib]
name = "kokjinsam_just"
path = "src/lib.rs"

[[bin]]
name = "workflow"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
ignore = "0.4.25"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
signal-hook = "0.3.18"
thiserror = "2.0.18"
toml = "1.0.6"

[dev-dependencies]
tempfile = "3.24.0"
